<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BPP Smart Workflow</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- FontAwesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<!-- QR -->
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root{

  --main:#143f24;
  --main-dark:#0d2817;
  --gold:#c5a059;

  --bg:#eef2ef;

  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;

}

*{
  font-family:'Sarabun',sans-serif;
}

body{
  background:var(--bg);
  margin:0;
  padding:0;
}

/****************************************
 HEADER
****************************************/

.topbar{

  background:
  linear-gradient(
    135deg,
    var(--main),
    var(--main-dark)
  );

  color:white;

  padding:18px;

  box-shadow:
  0 4px 20px rgba(0,0,0,.15);

  position:sticky;
  top:0;
  z-index:100;

}

.logo-wrap{

  display:flex;
  align-items:center;
  gap:14px;

}

.logo-icon{

  width:52px;
  height:52px;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    var(--gold),
    #e5c989
  );

  display:flex;
  align-items:center;
  justify-content:center;

  color:black;

  font-size:22px;

  box-shadow:
  0 4px 12px rgba(0,0,0,.25);

}

.title-main{

  font-size:20px;
  font-weight:700;

}

.title-sub{

  font-size:12px;
  opacity:.8;

}

/****************************************
 TAB
****************************************/

.tab{
  display:none;
}

.tab.active{
  display:block;
}

/****************************************
 CARD
****************************************/

.card{

  background:white;

  border-radius:24px;

  box-shadow:
  0 6px 24px rgba(0,0,0,.06);

  padding:18px;

}

/****************************************
 STATS
****************************************/

.stats-grid{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:14px;

}

.stat-card{

  border-radius:22px;

  padding:18px;

  color:white;

  position:relative;

  overflow:hidden;

}

.stat-card::after{

  content:"";

  position:absolute;

  width:100px;
  height:100px;

  border-radius:50%;

  background:
  rgba(255,255,255,.12);

  right:-30px;
  top:-30px;

}

.stat-title{

  font-size:13px;
  opacity:.9;

}

.stat-value{

  font-size:34px;
  font-weight:700;

  margin-top:8px;

}

.blue{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.green{
  background:linear-gradient(135deg,#16a34a,#15803d);
}

.red{
  background:linear-gradient(135deg,#dc2626,#b91c1c);
}

.gold{
  background:linear-gradient(135deg,#c5a059,#a67c2e);
}

/****************************************
 SEARCH
****************************************/

.search-box{

  width:100%;

  border:none;

  background:#f3f4f6;

  border-radius:16px;

  padding:14px 16px;

  outline:none;

  font-size:15px;

}

/****************************************
 TIMELINE
****************************************/

.timeline-item{

  position:relative;

  padding-left:28px;

  margin-bottom:22px;

}

.timeline-item::before{

  content:"";

  position:absolute;

  left:0;
  top:5px;

  width:14px;
  height:14px;

  border-radius:50%;

  background:var(--main);

}

.timeline-item::after{

  content:"";

  position:absolute;

  left:6px;
  top:18px;

  width:2px;
  height:calc(100% + 10px);

  background:#d1d5db;

}

.timeline-item:last-child::after{
  display:none;
}

.timeline-id{

  font-weight:700;
  color:#111827;

}

.timeline-status{

  margin-top:4px;

  font-size:14px;

  color:#374151;

}

.timeline-time{

  font-size:12px;
  color:#6b7280;

  margin-top:4px;

}

/****************************************
 BUTTON
****************************************/

.main-btn{

  width:100%;

  border:none;

  border-radius:20px;

  padding:16px;

  font-size:16px;
  font-weight:700;

  cursor:pointer;

  transition:.2s;

}

.main-btn:active{
  transform:scale(.98);
}

.btn-main{

  background:
  linear-gradient(
    135deg,
    var(--main),
    var(--main-dark)
  );

  color:white;

}

.workflow-btn{

  border-radius:22px;

  padding:18px;

  border:none;

  width:100%;

  text-align:left;

  cursor:pointer;

  transition:.2s;

}

.workflow-btn:active{
  transform:scale(.98);
}

.workflow-title{
  font-weight:700;
}

.workflow-sub{

  font-size:12px;

  opacity:.7;

  margin-top:5px;

}

/****************************************
 INPUT
****************************************/

.input{

  width:100%;

  border:none;

  background:#f3f4f6;

  border-radius:18px;

  padding:15px;

  outline:none;

  box-sizing:border-box;

  font-size:15px;

}

/****************************************
 QR BOX
****************************************/

.qr-card{

  text-align:center;

  border:3px dashed var(--main);

}

.qr-badge{

  display:inline-block;

  background:var(--main);

  color:white;

  padding:6px 14px;

  border-radius:999px;

  font-size:12px;

  margin-bottom:15px;

}

/****************************************
 NAVBAR
****************************************/

.bottom-nav{

  position:fixed;

  bottom:0;
  left:0;
  right:0;

  background:white;

  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  padding:10px 0;

  border-top:
  1px solid #ddd;

  z-index:999;

  box-shadow:
  0 -4px 16px rgba(0,0,0,.08);

}

.nav-btn{

  border:none;
  background:none;

  display:flex;
  flex-direction:column;

  align-items:center;

  gap:5px;

  color:#6b7280;

  font-size:11px;

}

.nav-btn.active{

  color:var(--main);

  font-weight:700;

}

.nav-btn i{

  font-size:20px;

}

/****************************************
 BADGE
****************************************/

.badge{

  display:inline-block;

  padding:6px 12px;

  border-radius:999px;

  font-size:12px;

  font-weight:700;

}

.badge-red{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-green{
  background:#dcfce7;
  color:#166534;
}

.badge-blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-gold{
  background:#fef3c7;
  color:#92400e;
}

/****************************************
 PRINT
****************************************/

@media print{

  body *{
    visibility:hidden;
  }

  #printArea,
  #printArea *{
    visibility:visible;
  }

  #printArea{

    position:absolute;
    left:0;
    top:0;
    width:100%;

  }

}

</style>

</head>

<body>

<!-- HEADER -->
<div class="topbar">

  <div class="logo-wrap">

    <div class="logo-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

    <div>

      <div class="title-main">
        🇹🇭 BPP SMART WORKFLOW
      </div>

      <div class="title-sub">
        ระบบติดตามแฟ้มงานอัจฉริยะ ตชด.
      </div>

    </div>

  </div>

</div>

<!-- MAIN -->
<div style="padding:16px;padding-bottom:100px;">

  <!-- DASHBOARD -->
  <section id="dashboard"
  class="tab active">

    <!-- STATS -->
    <div class="stats-grid">

      <div class="stat-card blue">

        <div class="stat-title">
          📥 หน้าห้อง ผกก.
        </div>

        <div class="stat-value"
        id="count1">
          0
        </div>

      </div>

      <div class="stat-card green">

        <div class="stat-title">
          📤 หน้าห้อง ผบก.
        </div>

        <div class="stat-value"
        id="count2">
          0
        </div>

      </div>

      <div class="stat-card red">

        <div class="stat-title">
          ❌ ตีกลับ
        </div>

        <div class="stat-value"
        id="countReject">
          0
        </div>

      </div>

      <div class="stat-card gold">

        <div class="stat-title">
          📁 ทั้งหมด
        </div>

        <div class="stat-value"
        id="countTotal">
          0
        </div>

      </div>

    </div>

    <!-- TIMELINE -->
    <div class="card"
    style="margin-top:18px;">

      <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;">

        <div style="
        font-weight:700;
        font-size:18px;">

          📜 Timeline ล่าสุด

        </div>

      </div>

      <input
      type="text"
      class="search-box"
      placeholder="ค้นหาแฟ้ม..."
      id="searchInput">

      <div
      id="timeline"
      style="margin-top:22px;">

      </div>

    </div>

  </section>

  <!-- SCAN -->
  <section id="scan"
  class="tab">

    <div class="card">

      <div style="
      font-size:18px;
      font-weight:700;
      margin-bottom:16px;">

        📷 สแกนปกแฟ้ม

      </div>

      <div id="reader"></div>

      <button
      class="main-btn btn-main"
      style="margin-top:18px;"
      onclick="startScanner()">

        เปิดกล้องสแกน QR

      </button>

    </div>

  </section>

  <!-- REGISTER -->
  <section id="register"
  class="tab">

    <div class="card">

      <div style="
      font-size:18px;
      font-weight:700;
      margin-bottom:18px;">

        📁 ขึ้นทะเบียนแฟ้มใหม่

      </div>

      <div style="
      display:flex;
      flex-direction:column;
      gap:14px;">

        <input
        class="input"
        id="folderId"
        placeholder="Folder ID">

        <input
        class="input"
        id="title"
        placeholder="ชื่อเรื่อง">

        <input
        class="input"
        id="owner"
        placeholder="เจ้าของเรื่อง">

        <select
        class="input"
        id="priority">

          <option>
            🔴 ด่วนที่สุด
          </option>

          <option>
            🟠 ด่วน
          </option>

          <option selected>
            🟡 ปกติ
          </option>

          <option>
            🟢 ต่ำ
          </option>

        </select>

        <select
        class="input"
        id="security">

          <option>
            🔓 ปกติ
          </option>

          <option>
            🔒 ลับ
          </option>

          <option>
            🔐 ลับมาก
          </option>

          <option>
            ☢️ ลับที่สุด
          </option>

        </select>

        <button
        class="main-btn btn-main"
        onclick="registerFolder()">

          🚀 สร้างแฟ้ม + QR

        </button>

      </div>

    </div>

    <!-- QR -->
    <div
    id="qrBox"
    class="card qr-card"
    style="margin-top:18px;
    display:none;">

      <div id="printArea">

        <div class="qr-badge">
          🇹🇭 ตำรวจตระเวนชายแดน
        </div>

        <div id="qrcode"
        style="
        display:flex;
        justify-content:center;
        margin-top:10px;">
        </div>

        <div
        id="qrId"
        style="
        font-size:22px;
        font-weight:700;
        margin-top:14px;">
        </div>

        <div
        id="qrTitle"
        style="
        margin-top:10px;
        color:#4b5563;">
        </div>

      </div>

      <button
      class="main-btn btn-main"
      style="margin-top:20px;"
      onclick="window.print()">

        🖨️ พิมพ์ป้ายแฟ้ม

      </button>

    </div>

  </section>

  <!-- UPDATE -->
  <section id="update"
  class="tab">

    <div class="card">

      <div
      id="updateId"
      style="
      font-size:24px;
      font-weight:700;">
      </div>

      <div
      id="updateTitle"
      style="
      color:#6b7280;
      margin-top:6px;">
      </div>

      <div style="
      margin-top:14px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;">

        <div
        id="priorityBadge"
        class="badge badge-red">
        </div>

        <div
        id="securityBadge"
        class="badge badge-blue">
        </div>

      </div>

      <!-- WORKFLOW -->
      <div style="
      margin-top:22px;
      display:flex;
      flex-direction:column;
      gap:14px;">

        <button
        class="workflow-btn"
        style="
        background:#dbeafe;"
        onclick="selectWorkflow(
        'PHASE_1',
        '📥 จนท.หน้าห้อง ผกก. รับเรื่อง → ผ่าน ผกก.'
        )">

          <div class="workflow-title">
            📥 หน้าห้อง ผกก.
          </div>

          <div class="workflow-sub">
            รับเรื่อง / ผ่าน ผกก.
          </div>

        </button>

        <button
        class="workflow-btn"
        style="
        background:#dcfce7;"
        onclick="selectWorkflow(
        'PHASE_2',
        '📤 จนท.หน้าห้อง ผบก. รับเรื่อง → ผ่าน ผบก.'
        )">

          <div class="workflow-title">
            📤 หน้าห้อง ผบก.
          </div>

          <div class="workflow-sub">
            รับเรื่อง / ผ่าน ผบก.
          </div>

        </button>

        <button
        class="workflow-btn"
        style="
        background:#fee2e2;"
        onclick="selectWorkflow(
        'REJECT',
        '❌ ตีกลับแก้ไขเอกสาร'
        )">

          <div class="workflow-title">
            ❌ ตีกลับแก้ไข
          </div>

          <div class="workflow-sub">
            เอกสารไม่สมบูรณ์
          </div>

        </button>

      </div>

      <input
      id="reporter"
      class="input"
      style="margin-top:18px;"
      placeholder="ยศ-ชื่อ ผู้รายงาน">

      <textarea
      id="remark"
      class="input"
      style="
      margin-top:14px;
      min-height:120px;"
      placeholder="หมายเหตุ / ข้อสั่งการ">
      </textarea>

      <button
      class="main-btn btn-main"
      style="margin-top:20px;"
      onclick="submitUpdate()">

        🚀 บันทึกสถานะ

      </button>

    </div>

  </section>

</div>

<!-- NAV -->
<div class="bottom-nav">

  <button
  class="nav-btn active"
  onclick="showTab('dashboard',this)">

    <i class="fa-solid fa-chart-column"></i>
    <span>แดชบอร์ด</span>

  </button>

  <button
  class="nav-btn"
  onclick="showTab('scan',this)">

    <i class="fa-solid fa-qrcode"></i>
    <span>สแกน</span>

  </button>

  <button
  class="nav-btn"
  onclick="showTab('register',this)">

    <i class="fa-solid fa-folder-plus"></i>
    <span>ขึ้นเล่ม</span>

  </button>

  <button
  class="nav-btn"
  onclick="showTab('update',this)">

    <i class="fa-solid fa-location-dot"></i>
    <span>อัปเดต</span>

  </button>

</div>

<script>

let WEBAPP =
localStorage.getItem("BPP_WEBAPP")
|| "";

let currentFolder="";
let currentStatusCode="";
let currentStatusTitle="";

function showTab(id,btn=null){

  document
  .querySelectorAll(".tab")
  .forEach(t=>{
    t.classList.remove("active");
  });

  document
  .getElementById(id)
  .classList.add("active");

  document
  .querySelectorAll(".nav-btn")
  .forEach(b=>{
    b.classList.remove("active");
  });

  if(btn){
    btn.classList.add("active");
  }

}

function registerFolder(){

  const folderId =
  document.getElementById("folderId")
  .value;

  const title =
  document.getElementById("title")
  .value;

  const owner =
  document.getElementById("owner")
  .value;

  const priority =
  document.getElementById("priority")
  .value;

  const securityLevel =
  document.getElementById("security")
  .value;

  fetch(WEBAPP,{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      action:"register",

      folderId,
      title,
      owner,
      priority,
      securityLevel

    })

  })
  .then(r=>r.json())
  .then(res=>{

    if(res.success){

      createQR(folderId,title);

      alert("สร้างแฟ้มสำเร็จ");

      loadTimeline();

    }else{

      alert(res.message);

    }

  });

}

function createQR(id,title){

  document
  .getElementById("qrBox")
  .style.display="block";

  document
  .getElementById("qrId")
  .innerText=id;

  document
  .getElementById("qrTitle")
  .innerText=title;

  document
  .getElementById("qrcode")
  .innerHTML="";

  const url =
  location.origin +
  location.pathname +
  "?id=" + id;

  new QRCode(
    document.getElementById("qrcode"),
    {
      text:url,
      width:180,
      height:180
    }
  );

}

function startScanner(){

  const html5QrCode =
  new Html5Qrcode("reader");

  html5QrCode.start(

    { facingMode:"environment" },

    {
      fps:15,
      qrbox:{
        width:250,
        height:250
      }
    },

    (decodedText)=>{

      let id="";

      if(decodedText.includes("?id=")){

        id =
        new URL(decodedText)
        .searchParams.get("id");

      }

      openUpdate(id);

      html5QrCode.stop();

    }

  );

}

function openUpdate(id){

  currentFolder=id;

  showTab("update");

  document
  .getElementById("updateId")
  .innerText=id;

  fetch(
    WEBAPP +
    "?action=getFolder&folderId=" +
    id
  )
  .then(r=>r.json())
  .then(data=>{

    document
    .getElementById("updateTitle")
    .innerText=data.title;

    document
    .getElementById("priorityBadge")
    .innerText=data.priority;

    document
    .getElementById("securityBadge")
    .innerText=data.securityLevel;

  });

}

function selectWorkflow(code,title){

  currentStatusCode=code;
  currentStatusTitle=title;

  alert("เลือกสถานะแล้ว");

}

function submitUpdate(){

  const reporter =
  document.getElementById("reporter")
  .value;

  const remark =
  document.getElementById("remark")
  .value;

  fetch(WEBAPP,{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      action:"updateStatus",

      folderId:currentFolder,

      statusCode:
      currentStatusCode,

      statusTitle:
      currentStatusTitle,

      officer:reporter,

      remark:remark,

      priority:
      document
      .getElementById("priorityBadge")
      .innerText,

      securityLevel:
      document
      .getElementById("securityBadge")
      .innerText

    })

  })
  .then(r=>r.json())
  .then(()=>{

    alert("อัปเดตสำเร็จ");

    loadTimeline();

    showTab("dashboard");

  });

}

function loadTimeline(){

  fetch(
    WEBAPP +
    "?action=getRecent"
  )
  .then(r=>r.json())
  .then(data=>{

    let html="";

    let c1=0;
    let c2=0;
    let cr=0;

    data.forEach(item=>{

      if(item[3]==="PHASE_1") c1++;
      if(item[3]==="PHASE_2") c2++;
      if(item[3]==="REJECT") cr++;

      html += `

      <div class="timeline-item">

        <div class="timeline-id">
          ${item[1]}
        </div>

        <div class="timeline-status">
          ${item[4]}
        </div>

        <div class="timeline-time">
          🕒 ${item[0]}
        </div>

      </div>

      `;

    });

    document
    .getElementById("timeline")
    .innerHTML=html;

    document
    .getElementById("count1")
    .innerText=c1;

    document
    .getElementById("count2")
    .innerText=c2;

    document
    .getElementById("countReject")
    .innerText=cr;

    document
    .getElementById("countTotal")
    .innerText=data.length;

  });

}

window.onload=()=>{

  const params =
  new URLSearchParams(
    location.search
  );

  const id =
  params.get("id");

  if(id){

    openUpdate(id);

  }

  loadTimeline();

};

</script>

</body>
</html>
