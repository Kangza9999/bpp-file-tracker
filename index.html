<!-- =========================================
อัปเกรดเฉพาะส่วนเพิ่มเข้าไปจากไฟล์เดิม
โดย "ไม่เปลี่ยน Layout เดิม"
========================================= -->

<!-- =========================================
1. REPLACE HEADER CLASS
========================================= -->

<header class="
bg-gradient-to-r
from-[#102d1a]
via-[#143f24]
to-[#1b4d2d]
text-white
py-4
px-6
shadow-2xl
border-b-[3px]
border-[#c5a059]
backdrop-blur-xl
sticky
top-0
z-50
">

<!-- =========================================
2. REPLACE BODY BACKGROUND
========================================= -->

<body class="
bg-gradient-to-b
from-[#edf2ee]
to-[#e6ece8]
min-h-screen
text-gray-800
">

<!-- =========================================
3. เพิ่ม CSS นี้ใน <style>
========================================= -->

<style>

*{
  transition:
  background .2s ease,
  box-shadow .2s ease,
  transform .15s ease;
}

.glass-card{

  background:
  rgba(255,255,255,.92);

  backdrop-filter:
  blur(14px);

  border:
  1px solid rgba(255,255,255,.45);

  box-shadow:
  0 10px 28px rgba(0,0,0,.06);

}

.glass-card:hover{

  box-shadow:
  0 16px 36px rgba(0,0,0,.10);

}

.gold-glow{

  box-shadow:
  0 0 0 1px rgba(197,160,89,.15),
  0 8px 24px rgba(197,160,89,.18);

}

.soft-border{

  border:
  1px solid rgba(255,255,255,.4);

}

.nav-glass{

  background:
  rgba(255,255,255,.94);

  backdrop-filter:
  blur(18px);

  border:
  1px solid rgba(255,255,255,.45);

  box-shadow:
  0 10px 36px rgba(0,0,0,.12);

}

.timeline-hover:hover{

  background:#f8faf9;

}

.status-modern{

  transition:.2s;

}

.status-modern:hover{

  transform:
  translateY(-2px);

  box-shadow:
  0 10px 22px rgba(0,0,0,.08);

}

.status-modern:active{

  transform:
  scale(.98);

}

.qr-premium{

  border:
  3px dashed #143f24;

  position:relative;

  overflow:hidden;

}

.qr-premium::before{

  content:"BPP";

  position:absolute;

  font-size:120px;

  font-weight:900;

  opacity:.03;

  top:20px;
  left:50%;

  transform:translateX(-50%);

}

.online-pill{

  background:
  rgba(16,185,129,.12);

  border:
  1px solid rgba(16,185,129,.18);

  color:#a7f3d0;

  padding:6px 12px;

  border-radius:999px;

  font-size:12px;

}

</style>

<!-- =========================================
4. HEADER STATUS ONLINE
วางด้านขวา Header
========================================= -->

<div class="online-pill">
  ● ONLINE
</div>

<!-- =========================================
5. อัปเกรด Dashboard Card
========================================= -->

<!-- เดิม -->
<div class="bg-white p-4 rounded-xl shadow-sm">

<!-- เปลี่ยนเป็น -->
<div class="
glass-card
p-5
rounded-2xl
">

<!-- =========================================
6. อัปเกรด Status Card
========================================= -->

<div class="
status-modern
rounded-2xl
overflow-hidden
">

<!-- =========================================
7. อัปเกรด TABLE
========================================= -->

<thead class="
bg-gradient-to-r
from-[#143f24]
to-[#205e36]
text-white
">

<!-- =========================================
8. เพิ่ม Hover Table Row
========================================= -->

<tr class="timeline-hover">

<!-- =========================================
9. อัปเกรด Search Box
========================================= -->

<input
class="
w-full
bg-[#f3f4f6]
rounded-2xl
px-4
py-3
outline-none
focus:ring-4
focus:ring-[#143f24]/10
">

<!-- =========================================
10. อัปเกรด Bottom Nav
========================================= -->

<nav class="
fixed
bottom-3
left-3
right-3
nav-glass
rounded-2xl
py-2
z-50
">

<!-- =========================================
11. อัปเกรด NAV BUTTON
========================================= -->

<button class="
flex
flex-col
items-center
justify-center
gap-1
text-xs
transition-all
duration-200
active:scale-95
">

<!-- =========================================
12. อัปเกรด QR CARD
========================================= -->

<div id="qrBox"
class="
glass-card
qr-premium
rounded-2xl
p-5
mt-4
hidden
">

<!-- =========================================
13. อัปเกรด BUTTON หลัก
========================================= -->

<button class="
w-full
bg-gradient-to-r
from-[#143f24]
to-[#1d5734]
text-white
font-bold
py-4
rounded-2xl
shadow-lg
hover:shadow-2xl
active:scale-95
transition-all
duration-200
">

<!-- =========================================
14. อัปเกรด Workflow Button
========================================= -->

<button class="
status-modern
w-full
border
p-4
rounded-2xl
text-left
">

<!-- =========================================
15. เพิ่ม Animation โหลดระบบ
========================================= -->

<script>

window.addEventListener(
"load",
()=>{

  document.body.animate(
  [
    {
      opacity:0,
      transform:"translateY(10px)"
    },
    {
      opacity:1,
      transform:"translateY(0)"
    }
  ],
  {
    duration:350,
    easing:"ease-out"
  });

});

</script>

<!-- =========================================
16. เพิ่ม Soft Shadow ให้ QR
========================================= -->

<style>

#qrcode img{

  border-radius:14px;

  box-shadow:
  0 12px 28px rgba(0,0,0,.15);

}

</style>

<!-- =========================================
17. อัปเกรด Timeline Item
========================================= -->

<div class="
border-l-4
border-[#143f24]
pl-4
py-2
">

<!-- =========================================
18. เพิ่ม Gold Accent Title
========================================= -->

<h2 class="
text-[#143f24]
font-bold
tracking-wide
">

<!-- =========================================
19. เพิ่ม Premium Effect ให้ Header Logo
========================================= -->

<div class="
w-14
h-14
rounded-2xl
bg-gradient-to-br
from-[#d6bc7d]
to-[#c5a059]
shadow-xl
flex
items-center
justify-center
">

<!-- =========================================
20. เพิ่ม CSS Mobile Smooth
========================================= -->

<style>

html{
  -webkit-tap-highlight-color: transparent;
  scroll-behavior:smooth;
}

button{
  user-select:none;
}

</style>
